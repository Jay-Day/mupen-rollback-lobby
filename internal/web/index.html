<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMG-K Ranked</title>
<meta name="description" content="Rankings, rulesets and recent sets for RMG-K ranked netplay.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f6c22d' stroke='%23311' stroke-width='5'/%3E%3Cpath d='M38 4v56M4 40h56' stroke='%23311' stroke-width='7'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0b0a14;
  --bg2: #16131f;
  --panel: #1b1826;
  --panel-edge: #2b2638;
  --ink: #f4efe3;
  --ink2: #c8c0b0;
  --muted: #8f8778;
  --gold1: #fff3a8;
  --gold2: #f6c22d;
  --gold3: #b9780b;
  --red1: #ff6a3d;
  --red2: #d8261d;
  --red3: #7a0d0d;
  --outline: #1a0c05;
  --p1: #e5463b;
  --p2: #3f6fe8;
  --p3: #e9c21e;
  --p4: #3cb84b;
  --good: #59d27a;
  --bad: #ff6b5e;
  --radius: 10px;
  --head: "Arial Black", "Arial Bold", Gadget, Impact, system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 15px/1.5 var(--body);
  background: var(--bg);
  min-height: 100vh;
}
a { color: var(--gold2); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 48px; }

/* ── Title ── */
header.top { padding: 22px 0 8px; display: flex; align-items: center; gap: 14px; }
.emblem { width: 54px; height: 54px; flex: none; filter: drop-shadow(0 3px 0 var(--outline)); }
.logo {
  margin: 0; font: italic 900 clamp(26px, 6vw, 44px)/1 var(--head); letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--gold2);
  filter: drop-shadow(2px 0 0 var(--outline)) drop-shadow(-2px 0 0 var(--outline))
          drop-shadow(0 2px 0 var(--outline)) drop-shadow(0 -2px 0 var(--outline));
}
.logo small { display: block; font-size: .38em; letter-spacing: 4px; margin-top: 6px; }

/* ── Nav pills (the CSS "STOCK / BACK" buttons) ── */
nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; }
/* phones: a hamburger in the header opens the sections */
.hamburger { display: none; }
.pill {
  display: inline-block; padding: 7px 16px 6px; border-radius: 999px;
  font: italic 900 13px/1.2 var(--head); text-transform: uppercase; letter-spacing: .5px;
  color: #2a1603; background: var(--gold2);
  border: 2px solid var(--outline); box-shadow: 0 3px 0 var(--outline);
  cursor: pointer; text-decoration: none; transition: transform .08s, filter .15s;
}
.pill:hover { filter: brightness(1.08); text-decoration: none; }
.pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--outline); }
.pill.dim { background: #3c3646; color: var(--ink2); }
.pill[aria-current="page"] { color: #fff; background: var(--red2); }

/* ── Panels (VS menu boxes) ── */
.panel {
  background: var(--panel);
  border: 2px solid var(--outline); border-radius: var(--radius);
  box-shadow: inset 0 0 0 1px var(--panel-edge), 0 6px 0 rgba(0,0,0,.35);
  margin-bottom: 20px; overflow: hidden;
}
.panel > h2, .panel > .head {
  margin: 0; padding: 9px 16px 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font: italic 900 18px/1.2 var(--head); text-transform: uppercase; letter-spacing: .5px;
  color: var(--gold1); text-shadow: 1px 1px 0 var(--outline);
  background: var(--red2);
  border-bottom: 2px solid var(--outline);
}
.panel > .head h2 { margin: 0; font: inherit; }
.panel .body { padding: 14px 16px; }
.panel .body > :first-child { margin-top: 0; }
.panel .body > :last-child { margin-bottom: 0; }
.spacer { flex: 1; }

/* ── Leaderboard ── */
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
input[type=search] { width: min(220px, 100%); }
input[type=search], select {
  font: 14px var(--body); color: var(--ink); background: #0f0d17;
  border: 2px solid var(--outline); border-radius: 999px; padding: 5px 12px; outline: none;
  box-shadow: inset 0 0 0 1px var(--panel-edge);
}
input[type=search]:focus, select:focus { box-shadow: inset 0 0 0 1px var(--gold2); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 10px; text-align: left; white-space: nowrap; }
th {
  font: italic 900 11px var(--head); text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
  border-bottom: 1px solid var(--panel-edge);
}
td { border-bottom: 1px solid rgba(255,255,255,.04); }
tbody tr:hover td { background: rgba(246,194,45,.06); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.name a { color: var(--ink); font-weight: 700; }
.rank {
  display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 8px;
  font: italic 900 14px var(--head); color: #fff; background: #2e2a3a; border: 2px solid var(--outline);
  text-shadow: 1px 1px 0 var(--outline);
}
.rank.r1 { background: var(--p1); } .rank.r2 { background: var(--p2); }
.rank.r3 { background: var(--p3); color: #2a1603; text-shadow: none; } .rank.r4 { background: var(--p4); }
.tier {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font: italic 900 11px/1.5 var(--head);
  text-transform: uppercase; letter-spacing: .4px; border: 2px solid var(--outline); color: #1a1208;
}
.wl .w, .m-wl .w { color: var(--good); } .wl .l, .m-wl .l { color: var(--bad); }
.dev { color: var(--muted); font-size: 12px; }
.region { margin-left: 6px; color: var(--muted); font: 700 11px var(--body); letter-spacing: .5px; }
small.world { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; }
details.placement > summary { cursor: pointer; padding: 10px 16px; color: var(--ink2); list-style: none; }
details.placement > summary::before { content: "▸ "; } details.placement[open] > summary::before { content: "▾ "; }
.empty { padding: 26px 16px; text-align: center; color: var(--ink2); }
.empty b { display: block; font: italic 900 18px var(--head); color: var(--gold2); text-shadow: 2px 2px 0 var(--outline); }

/* ── Sets ── */
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.05); }
.set:last-child { border-bottom: 0; }
.scorelink { color: inherit; text-decoration: none; }
.scorelink:hover { text-decoration: underline; }
.replay { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; margin-top: 5px;
  font: 800 11px var(--head); text-transform: uppercase; letter-spacing: .04em; }
.replay a { color: var(--gold2); text-decoration: none; white-space: nowrap; }
.replay a:hover { text-decoration: underline; }
.replay.none { font: 600 11px var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.05); }
.filters select, .filters input { flex: 1 1 150px; min-width: 0; }
.filters select:disabled { opacity: .5; }
.filters .btn { flex: 0 0 auto; border: 0; cursor: pointer; }
.panel > .head .count { color: #ffe9c4; font: 700 13px var(--body); text-shadow: none; }
.btn { display: inline-block; padding: 8px 16px; border-radius: 8px; background: var(--gold2); color: var(--outline);
  font: italic 900 14px var(--head); text-transform: uppercase; text-decoration: none; box-shadow: 0 3px 0 var(--outline); }
.btn:hover { filter: brightness(1.08); }
.btn.alt { background: var(--panel-edge); color: var(--ink); box-shadow: 0 3px 0 var(--outline); }
p.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
ol.marks { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 6px; }
ol.marks li { display: flex; gap: 10px; align-items: baseline; }
ol.marks a { color: var(--gold2); font-weight: 700; text-decoration: none; }
ol.marks a:hover { text-decoration: underline; }
ol.marks .when { font: 700 13px ui-monospace, monospace; color: var(--gold2); min-width: 48px; }
.side { min-width: 0; }
.side.right { text-align: right; }
.side .who { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.side .who a { color: var(--ink); }
.side .meta { font-size: 12px; color: var(--muted); }
.side .meta + .who { margin-top: 6px; }
.slot { font: italic 900 11px var(--head); padding: 0 5px; border-radius: 4px; color: #fff; margin-right: 4px; }
.slot.s1 { background: var(--p1); } .slot.s2 { background: var(--p2); }
.slot.s3 { background: var(--p3); color: #2a1603; } .slot.s4 { background: var(--p4); }
.score { max-width: 46vw; text-align: center; font: italic 900 24px/1 var(--head); color: var(--gold1); text-shadow: 2px 2px 0 var(--outline); }
.score small { display: block; font: 600 11px var(--body); color: var(--muted); text-shadow: none; margin-top: 4px; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.status { display: inline-block; max-width: 100%; overflow-wrap: anywhere; font: italic 900 10px var(--head);
  text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--outline); }
.status.voided { background: #4a4455; color: var(--ink2); } .status.disputed { background: #8a5a12; color: #fff; }
.winner .who::after { content: " ★"; color: var(--gold2); }

/* ── Profile ── */
.profile { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.profile .big { font: italic 900 clamp(24px, 5vw, 34px)/1 var(--head); color: var(--ink); text-shadow: 3px 3px 0 var(--outline); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 14px; }
.stat { background: #121019; border: 2px solid var(--outline); border-radius: 8px; padding: 8px 12px; }
.stat .k { font: italic 900 10px var(--head); text-transform: uppercase; color: var(--muted); letter-spacing: .6px; }
.stat .v.text { font-size: 15px; line-height: 1.6; }
.stat .v { font: italic 900 22px/1.2 var(--head); color: var(--gold1); text-shadow: 2px 2px 0 var(--outline); font-variant-numeric: tabular-nums; }
.chart { position: relative; margin-top: 6px; }
.chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; transform: translate(-50%, -115%);
  background: #0f0d17; border: 2px solid var(--outline); box-shadow: inset 0 0 0 1px var(--gold3);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; display: none; }
.chart .tip b { color: var(--gold1); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
/* character rings: the arc is the share of the player's sets on that roster */
.ring { display: inline-block; flex: none; vertical-align: middle; }
.ring .track { stroke: var(--panel-edge); }
.ring .arc { stroke: var(--gold2); }
.ring text { fill: var(--ink); font-family: var(--body); font-weight: 800; }
/* phone-only extras in rankings rows, and the phone filter dropdowns */
.m-sub, .m-wl, .filterselects { display: none; }
.rings { display: flex; align-items: center; gap: 4px; }
.rings .more { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
  border: 1px dashed var(--panel-edge); color: var(--muted); font: 700 10px var(--body); flex: none; }
.mains { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.mains .label { color: var(--muted); font-size: 13px; }
button.main { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 3px; border-radius: 999px;
  background: #262131; border: 1px solid var(--panel-edge); color: var(--ink2); font: 13px var(--body); cursor: pointer; }
button.main:hover { border-color: var(--gold2); color: var(--ink); }
button.main b { color: var(--ink); font-weight: 700; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #262131; border: 1px solid var(--panel-edge); color: var(--ink2); }
button.chip { font-family: var(--body); cursor: pointer; }
button.chip:hover { border-color: var(--gold2); color: var(--ink); }

/* ── Text pages ── */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.card { background: #121019; border: 2px solid var(--outline); border-radius: 8px; padding: 12px 14px; }
.card h3 { margin: 0 0 6px; font: italic 900 15px var(--head); text-transform: uppercase; color: var(--gold2); text-shadow: 1px 1px 0 var(--outline); }
ul.rules { margin: 0; padding-left: 0; list-style: none; }
ul.rules li { padding: 6px 0 6px 26px; position: relative; border-bottom: 1px solid rgba(255,255,255,.05); }
ul.rules li:last-child { border-bottom: 0; }
ul.rules li::before { content: ""; position: absolute; left: 4px; top: 12px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--gold2); border: 2px solid var(--outline); }
ol.steps { counter-reset: step; list-style: none; padding: 0; margin: 0; }
ol.steps li { counter-increment: step; position: relative; padding: 10px 0 10px 50px; border-bottom: 1px solid rgba(255,255,255,.05); }
ol.steps li:last-child { border-bottom: 0; }
ol.steps li::before { content: counter(step); position: absolute; left: 0; top: 8px; width: 34px; height: 34px;
  display: grid; place-items: center; border-radius: 50%; font: italic 900 16px var(--head); color: #fff;
  background: var(--red2); border: 2px solid var(--outline); }
ol.steps b { color: var(--gold1); }
code { font: 12px ui-monospace, Consolas, monospace; background: #0f0d17; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--panel-edge); word-break: break-all; }
/* one grid for all rows: the name column fits the widest tier, so bars line up and never overlap */
.tierbar { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; }
.tierrow { display: contents; }
.tierrow .bar { height: 12px; border-radius: 999px; border: 2px solid var(--outline); }
.note { color: var(--ink2); font-size: 14px; }
.callout { margin: 0 0 20px; padding: 12px 16px; border: 2px solid var(--outline); border-left: 6px solid var(--gold2);
  border-radius: var(--radius); background: var(--panel); color: var(--ink2); font-size: 14px; }
.callout b { color: var(--ink); }
footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
footer a { color: var(--muted); }

[hidden] { display: none !important; }

/* ── Rosters ── */
.seg { display: inline-flex; border: 2px solid var(--outline); border-radius: 999px; overflow: hidden; background: #121019; }
.seg a { padding: 5px 14px; font: italic 900 13px var(--head); text-transform: uppercase; color: var(--ink2); text-decoration: none;
  white-space: nowrap; }
.seg a + a { border-left: 2px solid var(--outline); }
.seg a[aria-current] { background: var(--gold2); color: var(--outline); }
.seg a:focus-visible { outline: 2px solid var(--gold1); outline-offset: -3px; }
.rosterbar { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px 2px; }
.rosterbar .note { font-size: 13px; }
.score small.roster { margin-top: 2px; color: var(--ink2); }
button.more { display: block; margin: 12px auto 14px; border: 0; cursor: pointer; }
h3.roster { display: flex; align-items: center; gap: 8px; margin: 18px 0 0; font: italic 900 15px var(--head);
  text-transform: uppercase; color: var(--gold2); text-shadow: 1px 1px 0 var(--outline); }
h3.roster:first-of-type { margin-top: 6px; }

/* ── Scoring ── */
table.worth { margin: 6px 0 4px; }
table.worth th { white-space: normal; }
h3.sub { font: italic 900 15px var(--head); text-transform: uppercase; color: var(--gold2); margin: 18px 0 4px; }
.calc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 10px 0; }
.calc label { display: grid; gap: 4px; font: 800 12px var(--head); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.calc input.field { width: 100%; }
.calcout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.calc.calc4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.calcout .card span { display: block; font-size: 12px; color: var(--muted); }
.calcout .card b { display: block; font: italic 900 22px var(--head); color: var(--gold1); text-shadow: 2px 2px 0 var(--outline); }

/* ── Moderators ── */
input.field {
  font: 14px var(--body); color: var(--ink); background: #0f0d17;
  border: 2px solid var(--outline); border-radius: 8px; padding: 6px 10px; outline: none;
  box-shadow: inset 0 0 0 1px var(--panel-edge); min-width: 0;
}
input.field:focus { box-shadow: inset 0 0 0 1px var(--gold2); }
.btn.small { padding: 5px 11px; font-size: 12px; border: 0; cursor: pointer; }
.btn.danger { background: var(--red2); color: var(--ink); }
.btn:disabled { filter: grayscale(1) brightness(.7); cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dispute { padding: 0 16px; border-bottom: 2px solid var(--panel-edge); }
.dispute:last-child { border-bottom: 0; }
.dispute[open] { padding-bottom: 16px; }
details.dispute > summary, details.results > summary { cursor: pointer; padding: 12px 0; list-style: none; color: var(--ink2); }
details.dispute > summary::-webkit-details-marker, details.results > summary::-webkit-details-marker { display: none; }
details.dispute > summary::before, details.results > summary::before { content: "▸ "; color: var(--gold2); }
details.dispute[open] > summary::before, details.results[open] > summary::before { content: "▾ "; }
details.dispute > summary b { color: var(--ink); }
.panel > .head .btn.small { white-space: nowrap; }
.dispute .set { padding: 4px 0 10px; border: 0; }
ul.reports { margin: 0 0 10px; padding-left: 18px; color: var(--ink2); font-size: 14px; }
.msg { font-size: 13px; color: var(--bad); min-height: 1em; }
.msg.ok { color: var(--good); }
.codebox { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: #0f0d17;
  border: 2px dashed var(--gold3); }
.codebox code { font: 700 20px ui-monospace, monospace; color: var(--gold1); letter-spacing: 2px; }
.acct { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 800 11px var(--head);
  text-transform: uppercase; background: var(--good); color: var(--outline); }
.acct.off { background: var(--bad); }
td.detail { white-space: normal; color: var(--ink2); }
.loading { padding: 26px; text-align: center; color: var(--muted); }

@media (max-width: 640px) {
  .hamburger { display: grid; place-content: center; gap: 5px; margin-left: auto; flex: none; width: 46px; height: 46px;
    border: 2px solid var(--outline); border-radius: 10px; background: var(--panel); cursor: pointer;
    box-shadow: inset 0 0 0 1px var(--panel-edge), 0 3px 0 var(--outline); }
  .hamburger span { display: block; width: 22px; height: 3px; border-radius: 2px; background: var(--gold2);
    transition: transform .15s, opacity .15s; }
  .hamburger[aria-expanded="true"] span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .hamburger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .hamburger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
  .hamburger:focus-visible { outline: 2px solid var(--gold1); outline-offset: 2px; }
  nav.tabs { display: none; }
  nav.tabs.open { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 6px 0 20px; padding: 12px;
    border: 2px solid var(--outline); border-radius: var(--radius); background: var(--panel); }
  nav.tabs.open .pill { text-align: center; }
  /* rankings: the switches become three dropdowns on one line */
  .filterbar { display: block; padding: 12px 12px 4px; }
  .filterbar .seg { display: none; }
  .filterselects { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
  .filterselects select { width: 100%; min-width: 0; padding: 7px 8px; }
  .filterbar .note { display: block; margin-top: 8px; font-size: 12px; }
  /* rankings rows: characters under the name, W–L under the rating */
  .m-sub { display: block; margin-top: 5px; }
  .m-sub .rings { gap: 3px; }
  .m-sub .rings .more { width: 24px; height: 24px; font-size: 9px; }
  .m-wl { display: block; margin-top: 4px; font-size: 13px; }
  td.name, td.num { padding-top: 10px; padding-bottom: 10px; }
  .logo { font-size: 23px; }
  .logo small { font-size: .45em; letter-spacing: 2px; }
  .hide-sm { display: none; }
  .panel > .head .tools { width: 100%; }
  .panel > .head input[type=search] { width: 100%; }
  th, td { padding: 7px 6px; }
  .set { padding: 10px 10px; }
  .score { max-width: 30vw; }
  table.worth th, table.worth td { padding: 7px 5px; }
  .calcout { gap: 6px; }
  .calc.calc4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .calcout .card { padding: 8px 9px; }
}
@media (max-width: 460px) {
  .hide-xs, .dev { display: none; }
  td.name .region { display: none; }
  td.name { white-space: normal; }
  .seg a { padding: 5px 9px; font-size: 12px; }
  .logo small { letter-spacing: 2px; }
}
/* the smallest phones: tighter tables so nothing scrolls sideways */
@media (max-width: 360px) {
  th, td { padding: 6px 3px; }

</div>
<script>
"use strict";
// ── tiny DOM helper: h("tag.class", {attrs}, ...children) — text is always set safely
function h(sel, attrs, ...kids) {
  const [tag, ...cls] = sel.split(".");
  const el = document.createElement(tag || "div");
  if (cls.length) el.className = cls.join(" ");
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "style") el.style.cssText = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false)
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const view = document.getElementById("view");
const cache = {};
async function api(path) {
  const res = await fetch("/api/ranked/" + path, { headers: { Accept: "application/json" } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
async function overview() { return cache.ov || (cache.ov = await api("overview")); }

// ── formatting
const TIER_COLORS = { Bronze: "#c7834d", Silver: "#c9d1d9", Gold: "#f6c22d", Platinum: "#7fe0d2",
  Diamond: "#79b2ff", Master: "#c98bff", Grandmaster: "#ff6b6b" };
function tierBadge(row) {
  if (row.provisional) return h("span.tier", { style: "background:#6d6578;color:#f4efe3" }, "Placement");
  return h("span.tier", { style: "background:" + (TIER_COLORS[row.tier] || "#9aa") }, row.tier);
}
function ago(unix) {
  if (!unix) return "—";
  const s = Math.max(0, Date.now() / 1000 - unix);
  if (s < 60) return "just now";
  const units = [[86400 * 365, "y"], [86400 * 30, "mo"], [86400, "d"], [3600, "h"], [60, "m"]];
  for (const [n, u] of units) if (s >= n) return Math.floor(s / n) + u + " ago";
}
const playerLink = (name) => h("a", { href: "#/player/" + encodeURIComponent(name) }, name);

// Formats: a ladder is 1v1 or 2v2 (team battles, rated with OpenSkill).
const formatName = (l) => l && l.teamSize > 1 ? l.teamSize + "v" + l.teamSize : "1v1";
function ladderById(id) { return (cache.ov && cache.ov.ladders || []).find((l) => l.id === id); }
const isTeamSet = (set) => set.players.some((p) => p.team);

// Rosters: each roster (ruleset) of a ladder is a separate ranking.
const shortRoster = (name) => String(name || "").replace(/\s+roster$/i, "");
function rosterOf(ladder, id) { return ladder.rulesets.find((r) => r.id === id) || ladder.rulesets[0]; }
// The same choices as a dropdown (phones): picking one goes to its link.
function switchSelect(choices, current, label) {
  const select = h("select", { "aria-label": label, title: label },
    choices.map(([id, name, href]) => h("option", { value: href, selected: id === current }, name)));
  select.onchange = () => { location.hash = select.value; };
  return select;
}
function switchLinks(choices, current, label) {
  return h("nav.seg", { "aria-label": label }, choices.map(([id, name, href, title]) =>
    h("a", { href, title: title || null, "aria-current": id === current ? "page" : null }, name)));
}

// Regional rankings: continents by id, with short labels for switches and rows
const REGION_SHORT = { na: "NA", sa: "SA", eu: "EU", asia: "Asia", oc: "OCE" };
function regionName(id) {
  const r = (cache.ov && cache.ov.regions || []).find((x) => x.id === id);
  return r ? r.name : "";
}

// Character names by ranked module (ids are the game's own character ids)
const CHARACTERS = {
  smashremix: { 0: "Mario", 1: "Fox", 2: "Donkey Kong", 3: "Samus", 4: "Luigi", 5: "Link", 6: "Yoshi",
    7: "Captain Falcon", 8: "Kirby", 9: "Pikachu", 10: "Jigglypuff", 11: "Ness", 29: "Falco", 30: "Ganondorf",
    31: "Young Link", 32: "Dr. Mario", 33: "Wario", 34: "Dark Samus", 38: "Lucas", 52: "Bowser", 55: "Wolf",
    56: "Conker", 57: "Mewtwo", 58: "Marth", 59: "Sonic", 62: "Sheik", 63: "Marina", 64: "King Dedede",
    65: "Goemon", 68: "Banjo & Kazooie", 72: "Crash", 73: "Peach" },
};
// Short labels for character rings (fallback: the name's first letters)
const CHARACTER_SHORT = {
  smashremix: { 0: "MAR", 1: "FOX", 2: "DK", 3: "SAM", 4: "LUI", 5: "LNK", 6: "YOS", 7: "CF", 8: "KIR", 9: "PIK",
    10: "JIG", 11: "NES", 29: "FCO", 30: "GAN", 31: "YL", 32: "DOC", 33: "WAR", 34: "DSM", 38: "LUC", 52: "BOW",
    55: "WLF", 56: "CON", 57: "MEW", 58: "MTH", 59: "SON", 62: "SHK", 63: "MRN", 64: "DDD", 65: "GOE", 68: "B&K",
    72: "CRA", 73: "PCH" },
};
function charShort(ladderId, id) {
  const table = CHARACTER_SHORT[moduleOf(ladderId)] || {};
  return table[id] || charName(ladderId, id).replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase();
}
const SVG = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}
// A character ring: the label in the middle, the arc filled to `percent`.
function charRing(ladderId, c, size = 32) {
  const r = size / 2 - 2.5, len = 2 * Math.PI * r;
  const svg = svgEl("svg", { class: "ring", width: size, height: size, viewBox: `0 0 ${size} ${size}`, role: "img",
    "aria-label": `${charName(ladderId, c.id)}, ${c.percent}% of sets` });
  const title = svgEl("title", {});
  title.textContent = `${charName(ladderId, c.id)} · ${c.percent}% of sets (${c.sets})`;
  svg.append(title,
    svgEl("circle", { class: "track", cx: size / 2, cy: size / 2, r, fill: "none", "stroke-width": 3 }),
    svgEl("circle", { class: "arc", cx: size / 2, cy: size / 2, r, fill: "none", "stroke-width": 3, "stroke-linecap": "round",
      "stroke-dasharray": `${(len * Math.min(100, c.percent) / 100).toFixed(2)} ${len.toFixed(2)}`,
      transform: `rotate(-90 ${size / 2} ${size / 2})` }));
  const label = charShort(ladderId, c.id);
  const text = svgEl("text", { x: "50%", y: "50%", "text-anchor": "middle", "dominant-baseline": "central",
    "font-size": (size * (label.length > 2 ? 0.26 : 0.3)).toFixed(1) });
  text.textContent = label;
  svg.append(text);
  return svg;
}
function charRings(ladderId, p, size = 32) {
  if (!p.characters || !p.characters.length) return null;
  return h("div.rings", {}, p.characters.map((c) => charRing(ladderId, c, size)),
    p.moreCharacters ? h("span.more", { title: p.moreCharacters + " more" }, "+" + p.moreCharacters) : null);
}
// The ROM builds ranked accepts, across ladders (name + MD5 from ranked.json).
function rankedRoms(ov) {
  const seen = new Map();
  for (const l of ov.ladders) for (const rom of l.roms) if (!seen.has(rom.md5)) seen.set(rom.md5, rom);
  return [...seen.values()];
}
function romCallout(ov) {
  const roms = rankedRoms(ov);
  if (!roms.length) return null;
  return h("div.callout", {}, h("b", {}, "Ranked needs " + roms.map((r) => r.name || "a supported build").join(" or ") + ". "),
    "Other builds, including PAL versions and mods like +Extra, can't play ranked.");
}
// Rankings title: the Vanilla roster is the original game's cast, so it
// shows as Super Smash Bros.
function ladderTitle(ladder, roster) {
  return /vanilla/i.test(roster ? roster.id + " " + roster.name : "") ? ladder.name.replace(/^Smash Remix\b/, "Super Smash Bros") : ladder.name;
}
function rosterCount(ladderId) {
  const l = (cache.ov && cache.ov.ladders || []).find((x) => x.id === ladderId);
  return l ? l.rulesets.length : 0;
}
function moduleOf(ladderId) {
  const l = (cache.ov && cache.ov.ladders || []).find((x) => x.id === ladderId);
  return l ? l.moduleId : "";
}
function charName(ladderId, id) {
  const table = CHARACTERS[moduleOf(ladderId)] || {};
  return table[id] || ("#" + id);
}

function panel(title, ...body) { return h("section.panel", {}, h("h2", {}, title), ...body); }
function emptyState(title, text) { return h("div.empty", {}, h("b", {}, title), text); }
function errorState(err) { return panel("Oops", emptyState("Couldn't load this", err.message)); }

// ── Rankings
async function showRankings(params) {
  const ov = await overview();
  if (!ov.ladders.length) {
    return [panel("Rankings", emptyState("No ranked ladders yet", "This server isn't running ranked play."))];
  }
  const ladderId = params.get("ladder") || ov.ladders[0].id;
  const ladder = ov.ladders.find((l) => l.id === ladderId) || ov.ladders[0];
  const roster = rosterOf(ladder, params.get("ruleset"));
  const region = (ov.regions || []).some((r) => r.id === params.get("region")) ? params.get("region") : "";
  const data = await api("leaderboard?ladder=" + encodeURIComponent(ladder.id) + "&ruleset=" + encodeURIComponent(roster.id) +
    (region ? "&region=" + region : ""));
  const ranked = data.players.filter((p) => !p.provisional);
  const placement = data.players.filter((p) => p.provisional);
  const PAGE = 100;

  const search = h("input", { type: "search", placeholder: "Find a player…", "aria-label": "Find a player" });
  const tools = h("div.tools", {}, search);

  const row = (p, i) => h("tr", { "data-name": p.username.toLowerCase(), "data-more": i >= PAGE ? "" : null, hidden: i >= PAGE },
    h("td", {}, p.rank ? h("span.rank" + (p.rank <= 4 ? ".r" + p.rank : ""), {}, p.rank) : h("span.rank", {}, "–")),
    h("td.name", {}, playerLink(p.username),
      !region && p.region ? h("span.region", { title: regionName(p.region) }, REGION_SHORT[p.region] || "") : null,
      region && p.worldRank ? h("small.world", { title: "Worldwide rank" }, "#" + p.worldRank + " world") : null,
      h("div.m-sub", {}, charRings(ladder.id, p, 24))),
    h("td.hide-sm", {}, charRings(ladder.id, p)),
    h("td.hide-xs", {}, tierBadge(p)),
    h("td.num", {}, String(p.rating), h("span.dev", {}, " ±" + p.deviation),
      h("div.m-wl", {}, h("span.w", {}, p.wins), "–", h("span.l", {}, p.losses))),
    h("td.num.wl.hide-sm", {}, h("span.w", {}, p.wins), "–", h("span.l", {}, p.losses)),
    h("td.num.hide-sm", {}, p.sets),
    h("td.num.hide-sm", {}, ago(p.lastPlayed)));
  const table = (rows, paged) => h("div.scroll", {}, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "#"), h("th", {}, "Player"), h("th.hide-sm", {}, "Plays"), h("th.hide-xs", {}, "Tier"),
      h("th.num", {}, "Rating"), h("th.num.hide-sm", {}, "W–L"), h("th.num.hide-sm", {}, "Sets"), h("th.num.hide-sm", {}, "Last set"))),
    h("tbody", {}, rows.map((p, i) => row(p, paged ? i : 0)))));

  // 1v1 / 2v2, then the roster; switching format keeps the roster's place
  const rosterIndex = Math.max(0, ladder.rulesets.findIndex((r) => r.id === roster.id));
  const link = (l, r, g = region) => "#/?ladder=" + encodeURIComponent(l.id) + "&ruleset=" + encodeURIComponent(r.id) +
    (g ? "&region=" + g : "");
  const formatChoices = ov.ladders.length > 1 ? ov.ladders.map((l) =>
    [l.id, formatName(l), link(l, l.rulesets[Math.min(rosterIndex, l.rulesets.length - 1)])]) : null;
  const rosterChoices = ladder.rulesets.length > 1 ? ladder.rulesets.map((r) => [r.id, shortRoster(r.name), link(ladder, r)]) : null;
  const regionChoices = (ov.regions || []).length ? [["", "World", link(ladder, roster, ""), "Everyone"],
    ...ov.regions.map((r) => [r.id, REGION_SHORT[r.id] || r.name, link(ladder, roster, r.id), r.name])] : null;
  const formats = formatChoices ? switchLinks(formatChoices, ladder.id, "Format") : null;
  const rosters = rosterChoices ? switchLinks(rosterChoices, roster.id, "Roster") : null;
  const regions = regionChoices ? switchLinks(regionChoices, region, "Region") : null;
  // phones: the three switches as dropdowns on one line
  const dropdowns = h("div.filterselects", {},
    formatChoices ? switchSelect(formatChoices, ladder.id, "Format") : null,
    rosterChoices ? switchSelect(rosterChoices, roster.id, "Roster") : null,
    regionChoices ? switchSelect(regionChoices, region, "Region") : null);
  const note = region
    ? regionName(region) + ": players who play most of their sets from there. Ratings and tiers are worldwide."
    : ladder.teamSize > 1 ? "2v2 team battles: your own rating, whoever you team with."
      : "Each format and roster is its own ranking.";
  const switcher = h("div.rosterbar.filterbar", {}, formats, rosters, regions, dropdowns, h("span.note", {}, note));
  let expanded = false;
  const more = ranked.length > PAGE ? h("button.btn.alt.small.more", { type: "button" }, `Show all ${ranked.length} players`) : null;
  const main = h("section.panel", {},
    h("div.head", {}, h("h2", {}, ladderTitle(ladder, roster)), h("span.spacer"), tools),
    switcher,
    ranked.length ? table(ranked, true)
      : region ? emptyState("No ranked players in " + regionName(region) + " yet", "Try another region or World.")
        : emptyState("No ranked players yet", "Players appear here once they finish their placement sets."),
    more);
  const blocks = [main];
  let details = null;
  if (placement.length) {
    details = h("details.placement", {},
      h("summary", {}, `In placement (${placement.length}) — rating still settling`), table(placement, false));
    blocks.push(h("section.panel", {}, details));
  }
  const showRows = () => {
    const q = search.value.trim().toLowerCase();
    let placementHit = false;
    for (const tr of document.querySelectorAll("tbody tr[data-name]")) {
      const hit = q !== "" && tr.dataset.name.includes(q);
      tr.hidden = q !== "" ? !hit : tr.hasAttribute("data-more") && !expanded;
      placementHit ||= hit && details !== null && details.contains(tr);
    }
    if (placementHit) details.open = true;
    if (more) more.hidden = q !== "" || expanded;
  };
  if (more) more.onclick = () => { expanded = true; showRows(); };
  search.oninput = showRows;
  return blocks;
}

// ── Sets
function setRow(set, linked = true) {
  // a side is one player (1v1) or a team (2v2)
  const sides = isTeamSet(set) ? [1, 2].map((t) => set.players.filter((p) => p.team === t)) : set.players.map((p) => [p]);
  const [a, b] = sides;
  if (!a || !b || !a.length || !b.length) return null;
  const won = (members) => isTeamSet(set) ? set.winnerTeam === members[0].team : set.winner === members[0].username;
  const side = (members, right) => h("div.side" + (right ? ".right" : "") + (won(members) ? ".winner" : ""), {},
    members.map((p) => {
      const delta = p.after - p.before;
      const chars = p.characters.map((c) => charName(set.ladder, c)).join(", ");
      return [h("div.who", {}, h("span.slot.s" + p.slot, {}, "P" + p.slot), playerLink(p.username)),
        h("div.meta", {},
          set.status === "rated" ? h("span.delta." + (delta >= 0 ? "up" : "down"), {},
            (delta >= 0 ? "+" : "") + delta + " ") : null,
          set.status === "rated" ? p.after : p.before, chars ? " · " + chars : "")];
    }));
  const games = (members) => members[0].games;
  const reason = { player_left: "player left", result_timeout: "no result", reports_disagree: "reports disagree",
    invalid_result: "invalid result", server_error: "server error" }[set.reason] || set.reason;
  return h("div.set", {},
    side(a, false),
    h("div.score", {}, linked ? h("a.scorelink", { href: "#/set/" + set.id, title: "Set details" }, `${games(a)} – ${games(b)}`)
        : `${games(a)} – ${games(b)}`,
      h("small", {}, set.status === "rated" ? ago(set.time)
        : h("span.status." + set.status, { title: reason || "" }, set.status + (reason ? ": " + reason : ""))),
      set.rulesetName && (rosterCount(set.ladder) > 1 || (cache.ov && cache.ov.ladders.length > 1))
        ? h("small.roster", {}, ((cache.ov && cache.ov.ladders.length > 1) ? formatName(ladderById(set.ladder)) + " · " : "") +
          shortRoster(set.rulesetName)) : null,
      linked ? replayStatus(set) : null),
    side(b, true));
}
// "rmgk://" link that opens a replay in RMG-K
const watchLink = (url, record) => "rmgk://replay?url=" + encodeURIComponent(location.origin + url) +
  (record > 0 ? "&record=" + record : "");
function replayStatus(set) {
  if (!set.hasReplay || !set.replayUrl) return h("span.replay.none", { title: "No replay was uploaded for this set" }, "no replay");
  return h("span.replay", {},
    h("a", { href: watchLink(set.replayUrl), title: "Watch in RMG-K" }, "▶ Watch"),
    h("a", { href: set.replayUrl, download: "rmgk-set-" + set.id + ".krec", title: "Download the replay (.krec)" }, "⬇ .krec"));
}

// A filterable, paged list of sets: roster, player (or opponent on a player's
// page), character and result. Filters live in the page's URL.
async function setsBrowser({ title, player, params, basePath }) {
  const ov = await overview();
  const PAGE = 30;
  // with one ladder it's always chosen; with several, "" = all formats
  const initialLadder = ov.ladders.length === 1 ? ov.ladders[0] : ov.ladders.find((l) => l.id === params.get("ladder"));
  let ladder = initialLadder;
  const state = {
    ladder: initialLadder ? initialLadder.id : "",
    ruleset: ladder && ladder.rulesets.some((r) => r.id === params.get("ruleset")) ? params.get("ruleset") : "",
    who: params.get(player ? "opponent" : "player") || "",
    character: params.get("character") || "",
    result: ["win", "loss"].includes(params.get("result")) ? params.get("result") : "",
  };

  const formatSel = ov.ladders.length > 1 ? h("select", { "aria-label": "Format" },
    h("option", { value: "" }, "All formats"),
    ov.ladders.map((l) => h("option", { value: l.id, selected: l.id === state.ladder }, formatName(l)))) : null;
  const rosterSel = ov.ladders.some((l) => l.rulesets.length > 1) ? h("select", { "aria-label": "Roster" }) : null;
  const fillRosters = () => {
    if (!rosterSel) return;
    rosterSel.replaceChildren(h("option", { value: "" }, ladder ? "All rosters" : "All rosters (pick a format)"),
      ...(ladder ? ladder.rulesets : []).map((r) => h("option", { value: r.id, selected: r.id === state.ruleset },
        shortRoster(r.name) + " roster")));
    rosterSel.disabled = !ladder;
  };
  fillRosters();
  const who = h("input", { type: "search", value: state.who, placeholder: player ? "Opponent…" : "Player…",
    "aria-label": player ? "Opponent" : "Player", autocomplete: "off" });
  const charSel = h("select", { "aria-label": "Character" });
  const fillCharacters = () => {
    const ids = new Set();
    for (const l of ladder ? [ladder] : ov.ladders)
      for (const r of l.rulesets) if (!state.ruleset || r.id === state.ruleset) for (const c of r.characters || []) ids.add(c);
    if (state.character !== "") ids.add(+state.character);
    const any = ladder || ov.ladders[0];
    const named = any ? [...ids].map((id) => [id, charName(any.id, id)]).sort((x, y) => x[1].localeCompare(y[1])) : [];
    charSel.replaceChildren(h("option", { value: "" }, "Any character"),
      ...named.map(([id, name]) => h("option", { value: String(id), selected: String(id) === state.character }, name)));
  };
  fillCharacters();
  const resultSel = h("select", { "aria-label": "Result" },
    h("option", { value: "" }, "Wins and losses"), h("option", { value: "win" }, "Wins"), h("option", { value: "loss" }, "Losses"));
  resultSel.value = state.result;
  const clear = h("button.btn.alt.small", { type: "button" }, "Clear");
  const count = h("span.count");
  const list = h("div");
  const more = h("button.btn.alt.small.more", { type: "button", hidden: true }, "Load more");

  const owner = () => player || state.who.trim();
  const query = (offset) => {
    const q = new URLSearchParams();
    if (state.ladder) q.set("ladder", state.ladder);
    if (state.ruleset) q.set("ruleset", state.ruleset);
    if (player) { q.set("player", player); if (state.who.trim()) q.set("opponent", state.who.trim()); }
    else if (state.who.trim()) q.set("player", state.who.trim());
    if (state.character !== "") q.set("character", state.character);
    if (state.result && owner()) q.set("result", state.result);
    q.set("limit", PAGE);
    q.set("offset", offset);
    return q;
  };
  const syncControls = () => {
    // wins/losses are someone's: the page's player or the one typed in
    resultSel.disabled = !owner();
    resultSel.title = owner() ? "Sets " + owner() + " won or lost" : "Pick a player first";
    charSel.title = owner() ? "Sets where " + owner() + " played this character" : "Sets where anyone played this character";
    clear.hidden = !((ov.ladders.length > 1 && state.ladder) || state.ruleset || state.who || state.character || state.result);

function ratingChart(points) {
  // single series: one 2px line, hover tooltip per point; the set list below is the table view
  const W = 600, H = 180, P = { l: 40, r: 10, t: 12, b: 22 };
  const wrap = h("div.chart");
  if (points.length < 2) { wrap.append(h("p.note", {}, "The rating chart appears after a few rated sets.")); return wrap; }
  const ys = points.map((p) => p.rating);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max(10, (hi - lo) * 0.15); lo = Math.floor((lo - pad) / 10) * 10; hi = Math.ceil((hi + pad) / 10) * 10;
  const x = (i) => P.l + (i / (points.length - 1)) * (W - P.l - P.r);
  const y = (v) => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", role: "img",
    "aria-label": `Rating history: from ${ys[0]} to ${ys[ys.length - 1]} over ${points.length} rated sets` });
  for (const v of [lo, Math.round((lo + hi) / 2), hi]) {
    svg.append(s("line", { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v), stroke: "rgba(255,255,255,.08)", "stroke-width": 1 }));
    const t = s("text", { x: P.l - 6, y: y(v) + 4, "text-anchor": "end", fill: "#8f8778", "font-size": 11 }); t.textContent = v; svg.append(t);
  }
  const d = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.rating).toFixed(1)).join(" ");
  svg.append(s("path", { d: d + ` L${x(points.length - 1)} ${H - P.b} L${x(0)} ${H - P.b} Z`, fill: "rgba(246,194,45,.10)" }));
  svg.append(s("path", { d, fill: "none", stroke: "#f6c22d", "stroke-width": 2, "stroke-linejoin": "round",
    "vector-effect": "non-scaling-stroke" }));
  const dot = s("circle", { r: 5, fill: "#f6c22d", stroke: "#1a0c05", "stroke-width": 2, visibility: "hidden" });
  svg.append(dot);
  const tip = h("div.tip");
  const hit = s("rect", { x: P.l, y: 0, width: W - P.l - P.r, height: H, fill: "transparent" });
  svg.append(hit);
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(points.length - 1, Math.round((fx - P.l) / (W - P.l - P.r) * (points.length - 1))));
    const p = points[i];
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(p.rating)); dot.setAttribute("visibility", "visible");
    tip.replaceChildren(h("b", {}, p.rating), " · set " + (i + 1) + " · " + new Date(p.time * 1000).toLocaleDateString());
    tip.style.left = (x(i) / W * r.width) + "px"; tip.style.top = (y(p.rating) / H * r.height) + "px"; tip.style.display = "block";
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", () => { tip.style.display = "none"; dot.setAttribute("visibility", "hidden"); });
  wrap.append(svg, tip);
  return wrap;
}

// Glicko-2, the same steps as internal/rating/glicko2.go; the constants come
// from the overview (g). Used for the examples and the calculator.
const GLICKO_SCALE = 173.7178;

  };

  if (delta * delta > phi * phi + v) B = Math.log(delta * delta - phi * phi - v);
  else { let k = 1; while (f(a - k * tau) < 0) k++; B = a - k * tau; }

    if (fC * fB <= 0) { A = B; fA = fB; } else fA /= 2;
    B = C; fB = fC;

  const e = glickoExpected(mu, muJ, gJ);

  const phiStar = Math.sqrt(phi * phi + sigma * sigma);

  return { rating: (mu + phiNew * phiNew * gJ * (score - e)) * GLICKO_SCALE + g.rating,
    deviation: Math.max(g.minDeviation, Math.min(g.maxDeviation, phiNew * GLICKO_SCALE)), volatility: sigma };

const OS = { mu: 25, sigma: 25 / 3, beta: 25 / 6, tau: 25 / 300, kappa: 0.0001, scale: 350 / (25 / 3) };
function osUpdate(g, teams, ranks) {
  const ts = teams.map((members, i) => {
    const players = members.map((r) => {
      const mu = OS.mu + (r.rating - g.rating) / OS.scale, sigma = r.deviation / OS.scale;
      return { mu, sigma: Math.sqrt(sigma * sigma + OS.tau * OS.tau) };
    });
    return { players, rank: ranks[i], mu: players.reduce((x, p) => x + p.mu, 0),
      sigma2: players.reduce((x, p) => x + p.sigma * p.sigma, 0) };
  });

  const sumQ = ts.map((tq) => ts.reduce((x, ti) => x + (ti.rank >= tq.rank ? Math.exp(ti.mu / c) : 0), 0));
  const a = ts.map((tq) => ts.filter((ti) => ti.rank === tq.rank).length);

    let omega = 0, delta = 0;
    const e = Math.exp(ti.mu / c);
    ts.forEach((tq, q) => {
      const pr = e / sumQ[q];

// ── Moderators (#/admin): disputed sets, accounts, activity log
async function adminApi(method, path, body) {
  const res = await fetch("/api/admin/" + path, {
    method, credentials: "same-origin",
    headers: { "X-RMGK-Admin": "1", "Content-Type": "application/json", Accept: "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ("HTTP " + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}
// runs an admin action from a button, showing failures in msg
async function adminAction(button, msg, run) {
  button.disabled = true;
  msg.textContent = "";
  try {
    await run();
  } catch (err) {
    msg.textContent = err.message;
    button.disabled = false;
  }
}

      adminAction(button, msg, async () => {
        await adminApi("POST", "sets/" + set.id + "/resolve", { ...body, note: note.value });

    const buttons = choices.map(([winner, label, who]) => {

}
// one page per tab (#/admin/accounts, /disputes, /activity), each loading only its own data
const ADMIN_TABS = [["accounts", "Accounts"], ["disputes", "Disputes"], ["activity", "Activity"]];
async function showAdmin(params, tab) {
  await overview();
  let me;
  try {
    me = await adminApi("GET", "session");
  } catch (err) {
    if (err.status === 401) return [adminSignIn()];
    throw err;
  }
  if (!ADMIN_TABS.some(([id]) => id === tab)) tab = "accounts";
  const signOut = h("button.btn.small", { type: "button" }, "Sign out");
  signOut.onclick = async () => { await adminApi("POST", "logout").catch(() => {}); route(); };
  const tabs = switchLinks(ADMIN_TABS.map(([id, name]) =>
    [id, id === "disputes" && me.disputes ? name + " (" + me.disputes + ")" : name, "#/admin/" + id]), tab, "Moderator pages");
  const content = tab === "disputes" ? disputesPanel((await adminApi("GET", "disputes")).sets)
    : tab === "activity" ? adminLogPanel((await adminApi("GET", "log")).entries)
    : await accountsPanel(params);
  return [
    h("section.panel", {}, h("div.head", {}, h("h2", {}, "Moderators"), h("span.spacer"),
      h("span.note", {}, "Signed in as " + me.name + " "), signOut), h("div.rosterbar", { style: "padding-bottom:12px" }, tabs)),
    content,
  ];
}

// ── Navigation menu (phones)
const navToggle = document.querySelector(".hamburger");
const navMenu = document.getElementById("sections");
function setNavOpen(open) {
  navToggle.setAttribute("aria-expanded", open ? "true" : "false");
  navToggle.setAttribute("aria-label", open ? "Close menu" : "Menu");
  navMenu.classList.toggle("open", open);
}
navToggle.addEventListener("click", () => setNavOpen(navToggle.getAttribute("aria-expanded") !== "true"));
navMenu.addEventListener("click", (ev) => { if (ev.target.closest("a")) setNavOpen(false); });
document.addEventListener("click", (ev) => {
  if (navMenu.classList.contains("open") && !navMenu.contains(ev.target) && !navToggle.contains(ev.target)) setNavOpen(false);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && navMenu.classList.contains("open")) { setNavOpen(false); navToggle.focus(); }
});

// ── Router
const routes = { "": showRankings, sets: showSets, rules: showRules, tiers: showTiers, scoring: showScoring, how: showHow, admin: showAdmin };
let token = 0;
async function route() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, query] = raw.split("?");
  const [page, arg] = path.split("/");
  const params = new URLSearchParams(query || "");
  const current = page === "player" ? "rankings" : page === "set" ? "sets" : (page || "rankings");
  for (const a of document.querySelectorAll("nav.tabs a")) {
    if (a.dataset.route === current) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  setNavOpen(false);
  const mine = ++token;
  view.replaceChildren(h("div.loading", {}, "Loading…"));
  let blocks;
  try {
    blocks = page === "player" && arg ? await showPlayer(decodeURIComponent(arg), params)
      : page === "set" && arg ? await showSet(arg)
      : page === "admin" ? await showAdmin(params, arg)
      : await (routes[page] || showRankings)(params);
  } catch (err) {
    blocks = [errorState(err)];
  }
  if (mine !== token) return;
  view.replaceChildren(...blocks);
  document.title = (page === "player" && arg ? decodeURIComponent(arg) + " · "
    : page === "set" && arg ? "Set #" + arg + " · " : page === "admin" ? "Moderators · " : "") + "RMG-K Ranked";
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
