<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<style>
:root { --bg: #0b0a14; --panel: #1b1826; --edge: #2b2638; --ink: #f4efe3; --ink2: #c8c0b0; --gold: #f6c22d;
  --outline: #1a0c05; --bad: #ff6b5e; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg);
  color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { width: min(360px, 100%); padding: 22px 20px; border-radius: 10px; background: var(--panel);
  border: 2px solid var(--outline); box-shadow: inset 0 0 0 1px var(--edge), 0 6px 0 rgba(0,0,0,.35); }
h1 { margin: 0 0 14px; font: italic 900 20px/1.2 "Arial Black", Impact, system-ui, sans-serif; text-transform: uppercase;
  color: var(--gold); }
label { display: block; margin-bottom: 6px; color: var(--ink2); font-size: 13px; }
input { width: 100%; font: 16px system-ui, sans-serif; color: var(--ink); background: #0f0d17; border: 2px solid var(--outline);
  border-radius: 8px; padding: 8px 10px; outline: none; box-shadow: inset 0 0 0 1px var(--edge); }
input:focus { box-shadow: inset 0 0 0 1px var(--gold); }
button { margin-top: 12px; width: 100%; padding: 9px 16px; border: 0; border-radius: 8px; cursor: pointer; background: var(--gold);
  color: var(--outline); font: italic 900 14px "Arial Black", Impact, system-ui, sans-serif; text-transform: uppercase;
  box-shadow: 0 3px 0 var(--outline); }
button:disabled { filter: grayscale(1) brightness(.7); cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid #fff3a8; outline-offset: 2px; }
.msg { min-height: 1.5em; margin-top: 10px; color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Sign in</h1>
  <form id="signin" method="post" action="/api/admin/login" autocomplete="on">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="submit" type="submit">Sign in</button>
    <div id="msg" class="msg" role="status"></div>
  </form>
</main>
<script>
"use strict";
(function () {
  const form = document.getElementById("signin");
  const password = document.getElementById("password");
  const submit = document.getElementById("submit");
  const msg = document.getElementById("msg");
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!password.value) return;
    submit.disabled = true;
    msg.textContent = "";
    let ok = false;
    try {
      const res = await fetch("/api/admin/login", {
        method: "POST", credentials: "same-origin", cache: "no-store",
        headers: { "X-RMGK-Admin": "1", "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ password: password.value }),
      });
      ok = res.ok;
    } catch (err) {
      ok = false;
    }
    password.value = "";
    if (ok) {
      location.reload();
      return;
    }
    msg.textContent = "Sign-in failed.";
    submit.disabled = false;
    password.focus();
  });
})();
</script>
</body>
</html>
