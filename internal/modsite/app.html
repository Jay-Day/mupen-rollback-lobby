<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Moderators</title>
<style>
:root {
  --bg: #0b0a14; --panel: #1b1826; --panel-edge: #2b2638; --well: #121019; --field: #0f0d17;
  --ink: #f4efe3; --ink2: #c8c0b0; --muted: #8f8778;
  --gold1: #fff3a8; --gold2: #f6c22d; --gold3: #b9780b; --red1: #ff6a3d; --red2: #d8261d; --outline: #1a0c05;
  --p1: #e5463b; --p2: #3f6fe8; --p3: #e9c21e; --p4: #3cb84b; --good: #59d27a; --bad: #ff6b5e;
  --radius: 10px;
  --head: "Arial Black", "Arial Bold", Gadget, Impact, system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 15px/1.5 var(--body); background: var(--bg); min-height: 100vh; }
a { color: var(--gold2); text-decoration: none; }
a:hover { text-decoration: underline; }
[hidden] { display: none !important; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0; }

/* header and tabs */
header.top { padding: 18px 0 10px; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.logo { margin: 0; font: italic 900 clamp(22px, 5vw, 32px)/1 var(--head); text-transform: uppercase; color: var(--gold2);
  text-shadow: 2px 2px 0 var(--outline); }
.logo small { display: block; font-size: .45em; letter-spacing: 3px; margin-top: 4px; color: var(--ink2); text-shadow: none; }
.spacer { flex: 1; }
.who { color: var(--ink2); font-size: 13px; }
nav.modtabs { display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 0 20px; background: var(--outline);
  border: 2px solid var(--outline); border-radius: 12px; overflow: hidden; }
nav.modtabs a { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px;
  background: var(--well); color: var(--ink2); font: italic 900 13px/1.4 var(--head); text-transform: uppercase; white-space: nowrap; }
nav.modtabs a:hover { color: var(--ink); background: #1d1a28; text-decoration: none; }
nav.modtabs a[aria-current] { background: var(--gold2); color: var(--outline); }
nav.modtabs a:focus-visible { outline: 2px solid var(--gold1); outline-offset: -4px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; text-align: center;
  font: normal 800 11px/16px var(--body); background: var(--good); color: var(--outline); border: 1px solid var(--outline); }

/* panels */
.panel { background: var(--panel); border: 2px solid var(--outline); border-radius: var(--radius);
  box-shadow: inset 0 0 0 1px var(--panel-edge), 0 6px 0 rgba(0,0,0,.35); margin-bottom: 20px; overflow: hidden; }
.panel > h2, .panel > .head { margin: 0; padding: 9px 16px 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font: italic 900 18px/1.2 var(--head); text-transform: uppercase; color: var(--gold1); text-shadow: 1px 1px 0 var(--outline);
  background: var(--red2); border-bottom: 2px solid var(--outline); }
.panel > .head h2 { margin: 0; font: inherit; }
.panel > .head .count { color: #ffe9c4; font: 700 13px var(--body); text-shadow: none; }
.panel .body { padding: 14px 16px; }
.panel .body > :first-child { margin-top: 0; }
.panel .body > :last-child { margin-bottom: 0; }
.empty { padding: 26px 16px; text-align: center; color: var(--ink2); }
.empty b { display: block; font: italic 900 18px var(--head); color: var(--gold2); text-shadow: 2px 2px 0 var(--outline); }
.loading { padding: 26px; text-align: center; color: var(--muted); }
.note { color: var(--ink2); font-size: 14px; }
.muted, time .ago { color: var(--muted); }
.callout { margin: 12px 0 0; padding: 12px 16px; border: 2px solid var(--outline); border-left: 6px solid var(--red1);
  border-radius: var(--radius); background: var(--panel); color: var(--ink2); font-size: 14px; line-height: 1.9; }
.callout b { color: var(--ink); }
code { font: 12px var(--mono); background: var(--field); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--panel-edge);
  word-break: break-all; }
.mt0 { margin-top: 0; } .mt12 { margin-top: 12px; } .mb0 { margin-bottom: 0; } .center { justify-content: center; }

/* tables */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 10px; text-align: left; white-space: nowrap; }
th { font: italic 900 11px var(--head); text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
  border-bottom: 1px solid var(--panel-edge); }
td { border-bottom: 1px solid rgba(255,255,255,.04); }
tbody tr:hover td { background: rgba(246,194,45,.06); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.detail { white-space: normal; color: var(--ink2); overflow-wrap: anywhere; }
td.cellwrap { white-space: normal; overflow-wrap: break-word; min-width: 90px; }
tr.formrow > td, tbody tr.formrow:hover > td { padding: 0 10px 10px; white-space: normal; background: none; }
tr.gone > td { opacity: .5; }
td.actcell { width: 1%; text-align: right; }
table.live td { vertical-align: top; }
table.live td.actcell .btn { margin-top: -3px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 14px; }
.stat { background: var(--well); border: 2px solid var(--outline); border-radius: 8px; padding: 8px 12px; }
.stat .k { font: italic 900 10px var(--head); text-transform: uppercase; color: var(--muted); letter-spacing: .6px; }
.stat .v { font: italic 900 20px/1.2 var(--head); color: var(--gold1); text-shadow: 2px 2px 0 var(--outline);
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .v.text { font-size: 15px; line-height: 1.6; }
a.stat { display: block; color: inherit; }
a.stat:hover { text-decoration: none; box-shadow: inset 0 0 0 1px var(--gold3); }
.livestats { margin: 0 0 20px; }

/* buttons and fields */
.btn { display: inline-block; padding: 8px 16px; border: 0; border-radius: 8px; cursor: pointer; background: var(--gold2);
  color: var(--outline); font: italic 900 14px var(--head); text-transform: uppercase; text-decoration: none;
  box-shadow: 0 3px 0 var(--outline); }
.btn:hover { filter: brightness(1.08); text-decoration: none; }
.btn.alt { background: var(--panel-edge); color: var(--ink); }
.btn.small { padding: 5px 11px; font-size: 12px; }
.btn.danger { background: var(--red2); color: var(--ink); }
.btn:disabled { filter: grayscale(1) brightness(.7); cursor: default; }
.btn:focus-visible { outline: 2px solid var(--gold1); outline-offset: 2px; }
button.more { display: block; margin: 12px auto 14px; }
input.field, input[type=search], select { font: 14px var(--body); color: var(--ink); background: var(--field);
  border: 2px solid var(--outline); border-radius: 8px; padding: 6px 10px; outline: none;
  box-shadow: inset 0 0 0 1px var(--panel-edge); min-width: 0; }
input[type=search] { width: min(240px, 100%); border-radius: 999px; padding: 5px 12px; }
input.field:focus, input[type=search]:focus, select:focus { box-shadow: inset 0 0 0 1px var(--gold2); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
p.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.msg { font-size: 13px; color: var(--bad); min-height: 1em; }
.msg.ok { color: var(--good); }
.msg.page { margin: -8px 0 14px; }
.msg.center { text-align: center; padding: 0 16px 12px; }
.actform .msg:empty, .msg.page:empty { display: none; }

/* tags, names, IPs */
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; border: 1px solid var(--outline); vertical-align: 1px;
  font: italic 900 10px/16px var(--head); text-transform: uppercase; letter-spacing: .3px; white-space: nowrap;
  background: #3c3646; color: var(--ink2); text-decoration: none; }
a.tag:hover { text-decoration: none; filter: brightness(1.2); }
.tag.gold { background: var(--gold2); color: var(--outline); }
.tag.red { background: var(--red2); color: #fff; }
.tag.green { background: #2f7a45; color: #fff; }
.tag.blue { background: #2d4fae; color: #fff; }
.tag.amber { background: #8a5a12; color: #fff; }
a.nm { color: var(--ink); font-weight: 700; overflow-wrap: break-word; }
a.ip { font: 13px var(--mono); overflow-wrap: anywhere; }
td > a.ip { display: inline-block; min-width: 15ch; max-width: 22ch; white-space: normal; vertical-align: top; }
.rn { overflow-wrap: anywhere; }
.sub { margin-top: 2px; font-size: 12px; color: var(--muted); white-space: normal; overflow-wrap: break-word; }
.sub a.nm { color: var(--ink2); font-weight: 600; }
.m-sub { display: none; }
.slot { font: italic 900 11px var(--head); padding: 0 5px; border-radius: 4px; color: #fff; }
.slot.s0 { background: #4a4455; } .slot.s1 { background: var(--p1); } .slot.s2 { background: var(--p2); }
.slot.s3 { background: var(--p3); color: #2a1603; } .slot.s4 { background: var(--p4); }
.big { font: italic 900 clamp(24px, 5vw, 34px)/1 var(--head); color: var(--ink); text-shadow: 3px 3px 0 var(--outline);
  overflow-wrap: anywhere; min-width: 0; }
.bigip { font: 700 clamp(18px, 4.6vw, 26px)/1.2 var(--mono); color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
.profile { display: flex; gap: 12px 16px; align-items: center; flex-wrap: wrap; }
h3.sub2 { font: italic 900 15px var(--head); text-transform: uppercase; color: var(--gold2); margin: 18px 0 6px; }

/* filters and forms: labels over their fields */
details.filterbox > summary, details.results > summary { cursor: pointer; padding: 10px 16px; list-style: none; color: var(--ink2);
  border-bottom: 1px solid rgba(255,255,255,.05); }
details.filterbox > summary::-webkit-details-marker, details.results > summary::-webkit-details-marker { display: none; }
details.filterbox > summary::before, details.results > summary::before { content: "\25B8  "; color: var(--gold2); }
details.filterbox[open] > summary::before, details.results[open] > summary::before { content: "\25BE  "; }
details.filterbox > summary b { color: var(--ink); }
details.connhist > summary { padding: 0; border: 0; }
details.connhist[open] > summary { margin-bottom: 10px; }
.ff { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,.05); align-items: end; }
.ff label, .actform label { display: grid; gap: 4px; min-width: 0; font: 800 11px var(--head); text-transform: uppercase;
  letter-spacing: .04em; color: var(--muted); }
.ff .field, .ff select, .actform .field, .actform select { width: 100%; }
.ff .btns { display: flex; gap: 8px; align-items: center; }
.ff .note { grid-column: 1 / -1; margin: 0; font-size: 13px; }
form.tracebar { flex-wrap: nowrap; }
form.tracebar label { flex: 1 1 auto; min-width: 0; }
form.tracebar .field { width: 100%; font-size: 16px; }
p.ctx { margin: 0; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }

/* the moderation form (kick / mute / timeout / ban, close room) */
.actform { display: grid; gap: 10px; margin: 8px 0; padding: 12px 14px; border-radius: 8px; background: var(--well);
  border: 2px solid var(--outline); box-shadow: inset 0 0 0 1px var(--gold3); white-space: normal; text-align: left; }
.actform .acthead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.actform .acthead b { font: italic 900 14px var(--head); text-transform: uppercase; color: var(--gold1); overflow-wrap: anywhere; }
.actform .quote { margin: 0; padding-left: 8px; border-left: 3px solid var(--panel-edge); color: var(--ink2); font-size: 13px;
  overflow-wrap: anywhere; }
.actfields { display: flex; flex-wrap: wrap; gap: 10px 12px; }
.actfields > label { flex: 1 1 170px; }
.actfields > label.grow { flex: 3 1 240px; }
.durpick { display: flex; gap: 6px; min-width: 0; }
.durpick select { flex: 1 1 auto; min-width: 0; }
.durpick input { flex: 0 1 120px; min-width: 0; }
.choice { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; border: 0; min-width: 0; }
.actform .choice label { display: block; position: relative; cursor: pointer; font: inherit; text-transform: none; letter-spacing: 0; }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.choice span { display: inline-block; padding: 5px 13px; border-radius: 999px; border: 2px solid var(--outline); background: #262131;
  color: var(--ink2); font: italic 900 12px var(--head); text-transform: uppercase; }
.choice label:hover span { color: var(--ink); }
.choice input:checked + span { background: var(--gold2); color: var(--outline); }
.choice input:focus-visible + span { outline: 2px solid var(--gold1); outline-offset: 2px; }
.actnote { margin: 0; font-size: 13px; }
.okline { margin: 0; color: var(--good); font-weight: 700; overflow-wrap: anywhere; }
.ipctl { display: grid; gap: 6px; }
.ipctl .actform { margin: 2px 0 0; }

/* the lobby chat tail */
.tail { max-height: 340px; overflow-y: auto; padding: 6px 0; overscroll-behavior: contain; background: var(--well);
  border-bottom: 1px solid rgba(255,255,255,.05); }
.tail:focus-visible { outline: 2px solid var(--gold1); outline-offset: -2px; }
.tail .empty { padding: 30px 16px; }
.tl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 2px 10px 2px 16px; }
.tl:hover { background: rgba(246,194,45,.05); }
.tl time { font: 12px/22px var(--mono); color: var(--muted); }
.tlb { overflow-wrap: anywhere; line-height: 22px; min-width: 0; }
.tl.blocked { background: rgba(216,38,29,.10); box-shadow: inset 3px 0 0 var(--red2); }
.tl.blocked .tx, .cl.blocked .text { color: var(--ink2); }
.tl.mod .tx, .cl.mod .text { color: var(--gold1); }
button.act { min-width: 36px; height: 24px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--panel-edge);
  background: #262131; color: var(--ink2); font: 900 9px/22px var(--body); letter-spacing: 2px; cursor: pointer; }
button.act:hover, button.act[aria-expanded="true"] { border-color: var(--gold2); color: var(--ink); }
button.act:focus-visible { outline: 2px solid var(--gold1); outline-offset: 1px; }
.tailact { padding: 2px 16px 12px; }

/* chat log lines */
.cl { padding: 8px 16px; border-bottom: 1px solid rgba(255,255,255,.05); }
.cl .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.cl .meta a.nm { font-size: 14px; }
.cl .text { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cl.blocked { background: rgba(216,38,29,.08); box-shadow: inset 4px 0 0 var(--red2); }

/* games */
.g { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) minmax(90px, auto); gap: 6px 16px; align-items: start;
  padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.05); }
.g:hover { background: rgba(246,194,45,.04); }
.g a.gt { color: var(--ink); font-weight: 700; overflow-wrap: anywhere; }
.gplayers { display: grid; gap: 3px; min-width: 0; }
.gp { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; min-width: 0; }
.gend { text-align: right; font-size: 13px; color: var(--ink2); }
ol.timeline { list-style: none; margin: 0; padding: 0; }
ol.timeline li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,.05); }
ol.timeline li:last-child { border-bottom: 0; }
ol.timeline .off { font: 700 13px/20px var(--mono); color: var(--gold2); }
ol.timeline .ev { overflow-wrap: anywhere; }

/* people: one block per IP; shared IPs (other names seen there) stand out */
.ipb { display: grid; gap: 6px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.06); }
.ipb:last-child { border-bottom: 0; }
.ipb.shared { background: rgba(246,194,45,.05); box-shadow: inset 4px 0 0 var(--gold2); }
.ipb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.ipb-head a.ip { font-size: 15px; font-weight: 700; }
.ipb .meta { font-size: 13px; color: var(--ink2); }
ul.names { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
ul.names li { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; max-width: 100%; padding: 3px 10px;
  border-radius: 999px; background: #262131; border: 1px solid var(--panel-edge); font-size: 13px; }
.onlinelist { display: grid; gap: 8px; }
.oe { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; }
.oe .info { min-width: 0; }
.oe .info > * { margin-right: 6px; }

@media (max-width: 640px) {
  nav.modtabs a { flex-basis: 30%; padding: 8px 6px; font-size: 11px; gap: 4px; }
  .ff { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px; }
  .ff .btns { grid-column: 1 / -1; }
  .cl, .ipb, p.ctx { padding-left: 12px; padding-right: 12px; }
  .tl { padding-left: 12px; padding-right: 8px; gap: 6px; }
  .tailact { padding: 2px 10px 12px; }
  .g { grid-template-columns: minmax(0, 1fr) auto; padding: 10px 12px; }
  .gplayers { grid-column: 1 / -1; grid-row: 2; }
  tr.formrow > td, tbody tr.formrow:hover > td { padding: 0 4px 8px; }
  .actform { padding: 10px; }
  th, td { padding: 7px 6px; }
  .hide-sm { display: none; }
  .m-sub { display: block; }
  ol.timeline li { grid-template-columns: 52px minmax(0, 1fr); gap: 4px 8px; }
  .livestats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .livestats .stat { padding: 6px 9px; }
  .livestats .stat .v { font-size: 17px; }
  .panel > .head .tools, .panel > .head input[type=search] { width: 100%; }
}
@media (max-width: 460px) { .hide-xs { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="logo">RMG-K<small>Moderators</small></h1>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn small" id="signout" type="button">Sign out</button>
  </header>
  <nav class="modtabs" id="tabs" aria-label="Moderator pages"></nav>
  <main id="view"><div class="loading">Loading…</div></main>
</div>
<script>
"use strict";
// The moderator pages. Names, chat and room names come from players: they
// only ever reach the page as text (h(), textContent, createTextNode), never
// as markup, so a chat line can't run anything here.

// ── DOM helper: h("tag.class", {attrs}, ...children)
function h(sel, attrs, ...kids) {
  const [tag, ...cls] = sel.split(".");
  const el = document.createElement(tag || "div");
  if (cls.length) el.className = cls.join(" ");
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    // no event-handler attributes, and links only within this page
    if (/^on/i.test(k) || k === "style") continue;
    if (k === "href" && !String(v).startsWith("#")) continue;
    el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false)
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
// replaceChildren with h()'s rules: nested lists flattened, null and false skipped, text as text
function fillEl(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false)
    .map((k) => (k instanceof Node ? k : document.createTextNode(String(k)))));
  return el;
}
const view = document.getElementById("view");
function panel(title, ...body) { return h("section.panel", {}, h("h2", {}, title), ...body); }
function emptyState(title, text) { return h("div.empty", {}, h("b", {}, title), text); }
function errorState(err) { return panel("Oops", emptyState("Couldn't load this", err.message)); }
function stat(k, v, text) { return h("div.stat", {}, h("div.k", {}, k), h("div.v" + (text ? ".text" : ""), {}, v)); }

// ── Talking to the server. Every call carries X-RMGK-Admin; changes are
// JSON. A signed-out call gets the server's plain 404 (not JSON): the
// session ended, so the page goes back to the sign-in page.
async function api(method, path, body, opts = {}) {
  const headers = { "X-RMGK-Admin": "1", Accept: "application/json" };
  if (method !== "GET") {
    headers["Content-Type"] = "application/json";
    body = body === undefined ? {} : body;
  }
  if (opts.background) headers["X-RMGK-Background"] = "1"; // a refresh, not the moderator's own click
  const res = await fetch("/api/admin/" + path, {
    method, headers, credentials: "same-origin", cache: "no-store",
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!(res.headers.get("Content-Type") || "").startsWith("application/json")) {
    const err = new Error("Your session ended. Sign in again.");
    err.status = 401;
    throw err;
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ("HTTP " + res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}
// A ban the server wants confirmed (the address is also another signed-in
// moderator's): ask, then send it again with confirm set.
async function confirmedBan(path, body) {
  try {
    return await api("POST", path, body);
  } catch (err) {
    if (err.status !== 409 || !err.data || !err.data.needsConfirm) throw err;
    if (!confirm(err.message + " Ban anyway?")) {
      const stop = new Error("Not banned.");

// The lobby chat as it happens (newest last); every sender can be acted on.
function lobbyTail(getLive) {
  const box = h("div.tail", { role: "log", "aria-live": "off", "aria-label": "Lobby chat, newest last", tabindex: "0" });
  const holder = h("div.tailact", { hidden: true });
  const state = h("span.count");
  let lastId = 0, primed = false, off = false, openButton = null;
  const atBottom = () => box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const closeForm = (refocus) => {
    holder.replaceChildren();
    holder.hidden = true;
    if (openButton) {
      openButton.setAttribute("aria-expanded", "false");
      if (refocus && openButton.isConnected) openButton.focus();
    }
    openButton = null;
  };
  const openFor = (m, button) => {
    const again = openButton === button;
    closeForm(false);
    if (again) return;
    const u = findLive(getLive(), m.from);
    const short = Array.from(m.text || "");
    const context = h("p.quote", {}, clockOf(m.time) + " “" + (short.length > 160 ? short.slice(0, 160).join("") + "…" : m.text) + "”");
    const close = () => closeForm(true);
    let form;
    if (u) form = modForm(liveTarget(u), { title: "Moderate " + m.from, context, onClose: close });
    else if (m.ip) form = modForm({ name: m.from, ip: m.ip }, { title: m.from + " is offline · their IP", context, onClose: close });
    else form = h("div.actform", {}, h("p.note.actnote", {}, m.from + " is offline and no IP was logged for this line."));
    holder.replaceChildren(form);
    holder.hidden = false;
    button.setAttribute("aria-expanded", "true");
    openButton = button;
    focusFirst(form);
  };
  const line = (m) => {
    const button = h("button.act", { type: "button", "aria-expanded": "false", "aria-label": "Moderate " + m.from,
      title: "Moderate " + m.from }, "•••");
    button.onclick = () => openFor(m, button);
    return h("div.tl" + (m.blocked ? ".blocked" : "") + (m.admin ? ".mod" : ""), {},
      h("time", { datetime: new Date(m.time * 1000).toISOString(), title: fullTime(m.time) }, clockOf(m.time)),
      h("div.tlb", {}, nameLink(m.from), m.admin ? [" ", tag("gold", "mod", "Sent by a signed-in moderator")] : null,
        m.blocked ? [" ", blockedTag(m)] : null, " ", h("span.tx", {}, m.text)),
      button);
  };
  const add = (msgs) => {
    const stick = atBottom();
    const empty = box.querySelector(".empty");
    if (empty && msgs.length) empty.remove();
    box.append(...msgs.map(line));
    for (const m of msgs) lastId = Math.max(lastId, m.id);
    while (box.childElementCount > 300) box.firstElementChild.remove();
    if (stick) toBottom(0);
  };
  // the first lines arrive before the panel is on the page: wait for it
  const toBottom = (tries) => {
    if (box.isConnected) box.scrollTop = box.scrollHeight;
    else if (tries < 120) requestAnimationFrame(() => toBottom(tries + 1));
  };
  // first the newest lines, then whatever is newer each time
  const step = async () => {
    if (off) return;
    try {
      if (!primed) {
        const d = await api("GET", "chat?channel=lobby&limit=60");
        primed = true;
        box.replaceChildren();
        if (d.messages.length) add(d.messages.slice().reverse());
        else box.append(emptyState("No lobby chat yet", "New lines show up here as they're sent."));
      } else {
        // more: newer lines are still waiting past this page
        for (let page = 0; page < 5; page++) {
          const d = await api("GET", "chat?channel=lobby&after=" + encodeURIComponent(lastId) + "&limit=200", undefined,
            { background: true });
          if (d.messages.length) add(d.messages);
          if (!d.more || !d.messages.length) break;
        }
      }
      state.textContent = "following";
    } catch (err) {
      if (isLogOff(err)) {
        off = true;
        state.textContent = "";
        box.replaceChildren(emptyState("Logging is off on this server", "There's no chat log to follow."));
        return;
      }
      if (err.status === 401) throw err;
      state.textContent = "couldn't refresh: " + err.message;
    }
  };
  box.append(h("div.loading", {}, "Loading chat…"));
  const panelEl = h("section.panel", {}, h("div.head", {}, h("h2", {}, "Lobby chat"), state, h("span.spacer"),
    h("a.btn.small.alt", { href: modHref("chat", { channel: "lobby" }) }, "Search the log")), box, holder);
  return { panel: panelEl, step, isOff: () => off };
}

    tbody.insertBefore(r.formTr, at);
  }
}

async function chatPage(params) {
  const KEYS = ["channel", "q", "name", "ip", "room", "match"];
  const f = {};
  for (const k of KEYS) f[k] = (params.get(k) || "").trim();
  // blocked: 1 = any reason, or one reason (filter, muted, flood)

    ["muted", "Sender was muted"], ["flood", "Flood limit"]];
  f.blocked = DELIVERY.some(([v]) => v && v === params.get("blocked")) ? params.get("blocked") : "";
  if (loggingIsOff()) return [loggingOff("Chat log")];
  const query = (extra) => {
    const q = new URLSearchParams();
    for (const k of KEYS) if (f[k]) q.set(k, f[k]);
    if (f.blocked) q.set("blocked", f.blocked);

// ── Rate limits: the lobby's per-IP request limits, and the IPs they refused.
// A refused player is told to wait; enough refusals time the IP out
// automatically. Every IP that was refused keeps a record here.
const RATE_KINDS = {
  room_create: ["Creating rooms", "Create Room"],
  room_join: ["Joining rooms", "Joining a room (wrong passwords count too) and starting a Quick Match search"],
  match_start: ["Starting games", "Start, and adding a player to a running game"],
  spectate: ["Opening live replays", "Watching a live replay"],
  room_update: ["Room settings", "Delay, prediction, live replay, late join, save data and seat swaps (seen by the room only)"],
  lobby_update: ["Lobby updates", "Going away and coming back, removing a player from a room, asking for chat history"],
};
const rateKindName = (k) => (RATE_KINDS[k] || [humanReason(k)])[0];
const perWindow = (count, sec) => (count ? plural(count, "request") + " per " + humanDur(sec) : "no limit");
function rateLimitsInEffect(d) {
  const rows = d.kinds.map((k) => h("tr", {},
    h("td", {}, h("b", {}, rateKindName(k.kind))),
    h("td", {}, perWindow(k.count, k.windowSeconds)),
    h("td.detail.hide-sm", {}, (RATE_KINDS[k.kind] || ["", ""])[1])));
  const ban = d.banStrikes
    ? [plural(d.banStrikes, "refused request") + " within " + humanDur(d.banWindowSeconds) + " time the IP out for ",
      h("b", {}, humanDur(d.banSeconds)), " (by ", tag("amber", "automatic"), ", on the Sanctions page)."]
    : [h("b", {}, "Off"), ": refusals never ban."];
  return h("div", {},
    h("div.scroll", {}, h("table", { "aria-label": "Limits per IP" },
      h("thead", {}, h("tr", {}, h("th", {}, "Request"), h("th", {}, "Allowed per IP"), h("th.hide-sm", {}, "Covers"))),
      h("tbody", {}, rows))),
    h("div.body", {},
      h("p.note.mt0", {}, h("b", {}, "Automatic timeout: "), ban),
      h("p.note", {}, h("b", {}, "Room list: "), d.roomListMinIntervalMs
        ? "sent to every player at most once every " + d.roomListMinIntervalMs + " ms; changes in between go out together."
        : "sent to every player on every change (coalescing is off)."),
      h("p.note", {}, h("b", {}, "Records: "), "kept " + plural(d.reportDays, "day") + " after an IP's last refused request. " +
        (d.exemptLoopback ? "Loopback addresses are never limited." : "This server limits loopback addresses too (a test build).")),
      h("p.note.mb0", {}, "Change any of these in lobby.json; the server applies them within seconds.")));
}
function rateRecord(r, pageMsg, onForget) {
  const now = Date.now() / 1000;
  const kinds = Object.keys(r.refused).sort((a, b) => r.refused[b] - r.refused[a]).map((k) => {
    const allowed = r.allowed[k];
    return tag("", rateKindName(k) + " · " + Number(r.refused[k]).toLocaleString(),
      allowed ? plural(allowed, "request") + " allowed in the current window" : "");
  });
  const names = r.usernames.length ? joinNodes(r.usernames.map(nameLink)) : h("span.muted", {}, "no name seen");
  const auto = r.autoBans
    ? [tag("amber", "auto-timed out" + (r.autoBans > 1 ? " ×" + r.autoBans : ""), "Timed out by the server for too many refused requests"),
      " ", when(r.autoBannedAt), r.autoBannedUntil > now ? [" · until ", when(r.autoBannedUntil)] : null]
    : h("span.muted", {}, "never timed out automatically");
  const msg = h("span.msg", { role: "status" });
  const forget = h("button.btn.small.alt", { type: "button", "aria-label": "Forget the record of " + r.ip,
    title: "Drop this record and reset the IP's request budgets (a ban or mute stays)" }, "Forget record");
  const block = h("div.ipb", {},
    h("div.ipb-head", {}, ipLink(r.ip), h("span.meta", {}, plural(r.totalRefused, "refused request")),
      r.online.length ? [tag("green", "online"), " ", joinNodes(r.online.map(nameLink))] : null,
      h("span.spacer"), msg, forget),
    h("div.meta", {}, "Names: ", names),
    h("div.meta", {}, "Last refused ", when(r.lastTrip, { seconds: true }), " · first ", when(r.firstTrip)),
    h("div.row", {}, kinds),
    h("div.meta", {}, auto),
    ipControls(r.ip, r.usernames[0] || "", { ban: r.ban, mute: r.mute }));
  forget.onclick = () => {
    if (!confirm(`Forget the rate limit record of ${r.ip}? Its request budgets start over; a ban or mute stays.`)) return;
    act(forget, msg, async () => {
      await api("POST", "ratelimits/forget", { ip: r.ip });
      block.remove();
      onForget();
      pageMsg.classList.add("ok");
      pageMsg.textContent = "Forgot the rate limit record of " + r.ip + ".";
    });
  };
  return block;
}
async function rateLimitsPage(params) {
  const ip = (params.get("ip") || "").trim();
  let d;
  try {
    d = await api("GET", "ratelimits?limit=500" + (ip ? "&ip=" + encodeURIComponent(ip) : ""));
  } catch (err) {
    if (err.status !== 503) throw err;
    return [panel("Rate limits", emptyState("Not attached", "This site isn't connected to the lobby's request limits."))];
  }
  const pageMsg = h("div.msg.page", { role: "status" });
  const count = h("span.count");
  const list = h("div");
  const empty = emptyState(ip ? "No record for " + ip : "Nobody hit a limit",
    ip ? "This IP hasn't had a request refused lately." : "IPs that send requests too fast show up here.");
  const sync = () => {
    const shown = list.childElementCount;
    count.textContent = d.more && !ip ? shown + " of " + d.total.toLocaleString() + ", most recent first" : plural(shown, "IP");
    empty.hidden = !!shown;
  };
  list.append(...d.records.map((r) => rateRecord(r, pageMsg, sync)));
  sync();
  const refresh = h("a.btn.small.alt", { href: modHref("ratelimits", { ip }), title: "Load the records again" }, "Refresh");
  refresh.onclick = (ev) => { ev.preventDefault(); goTo(modHref("ratelimits", { ip })); };
  const filter = ip ? h("p.ctx", {}, "Only ", ipLink(ip), " · ", h("a", { href: modHref("ratelimits") }, "show every IP")) : null;
  return [
    h("section.panel", {}, h("h2", {}, d.attached ? "Limits in effect" : "Limits off"),
      d.attached ? rateLimitsInEffect(d) : emptyState("No limits", "This lobby runs without request limits.")),
    pageMsg,
    h("section.panel", {}, h("div.head", {}, h("h2", {}, "IPs that hit a limit"), count, h("span.spacer"), refresh),
      filter, list, empty),
  ];
}

// ── Audit log: what moderators did, here and in the lobby, and the server's automatic bans
async function auditPage() {
  if (loggingIsOff()) return [loggingOff("Audit log")];
  const tbody = h("tbody");
  const count = h("span.count");
  const more = h("button.btn.alt.small.more", { type: "button", hidden: true }, "Load older");
  const moreMsg = h("div.msg.center");
  const empty = emptyState("No moderator actions yet", "Sign-ins, kicks, mutes, bans and closed rooms show up here.");
  const table = h("div.scroll", {}, h("table", { "aria-label": "Audit log" },
    h("thead", {}, h("tr", {}, h("th", {}, "When"), h("th", {}, "Moderator"), h("th", {}, "Action"), h("th", {}, "Detail"),
      h("th.hide-sm", {}, "From"))), tbody));
  const SOURCES = { site: "this site", lobby: "lobby", auto: "server" };
  const ACTIONS = { ban: ["red", "ban"], timeout: ["red", "timeout"], kick: ["red", "kick"], closeroom: ["red", "close room"],
    mute: ["amber", "mute"], unban: ["green", "unban"], unmute: ["green", "unmute"], "sign-in": ["", "sign in"],
    "sign-out": ["", "sign out"], "forget-rate-limit": ["", "forget record"] };
  const actionTag = (action) => {
    const [cls, label] = ACTIONS[action] || ["", humanReason(action) || "?"];
    return tag(cls, label);
  };
  let shown = 0, oldest = 0;
  const load = async () => {
    const d = await api("GET", "audit?limit=100" + (oldest ? "&before=" + encodeURIComponent(oldest) : ""));
    tbody.append(...d.entries.map((e) => h("tr", {},
      h("td", {}, when(e.time, { seconds: true })),
      h("td", {}, e.admin === "auto" ? tag("amber", "automatic", "The server did this itself") : e.admin),
      h("td", {}, actionTag(e.action)),
      h("td.detail", {}, e.detail),
      h("td.hide-sm", {}, SOURCES[e.source] || e.source || "—", e.ip ? [" · ", ipLink(e.ip)] : null))));
    shown += d.entries.length;
    if (d.entries.length) oldest = d.entries[d.entries.length - 1].id;
    more.hidden = !d.more;
    table.hidden = !shown;
    empty.hidden = !!shown;
    count.textContent = shown.toLocaleString() + (shown === 1 ? " entry" : " entries") + (d.more ? ", more older" : "");
  };
  await load();
  more.onclick = () => act(more, moreMsg, async () => { await load(); more.disabled = false; });
  return [h("section.panel", {}, h("div.head", {}, h("h2", {}, "Audit log"), count), table, empty, more, moreMsg)];
}

// ── Tabs and the router. To add a tab: a [id, title] in TABS and a page
// function in PAGES (it gets the link's query, the path after the tab, and
// alive() for its timers, and returns the panels to show).
const TABS = [["live", "Live"], ["chat", "Chat"], ["people", "People"], ["games", "Games"], ["sanctions", "Sanctions"],
  ["ratelimits", "Rate limits"], ["audit", "Audit log"]];
const PAGES = {
  live: livePage,
  chat: chatPage,
  people: peoplePage,
  games: (params, rest) => rest[0] === "match" ? gameByMatch(rest[1] || "", params) : rest[0] ? gameDetailPage(rest[0]) : gamesPage(params),
  sanctions: sanctionsPage,
  ratelimits: rateLimitsPage,
  audit: auditPage,
};
const tabsNav = document.getElementById("tabs");
const modBadges = {};
for (const [id, name] of TABS) {
  const a = h("a", { href: "#/" + id, "data-tab": id, "data-name": name }, name);
  if (id === "live") {
    modBadges.live = h("span.badge", { hidden: true, "aria-hidden": "true" });
    a.append(modBadges.live);
  }
  tabsNav.append(a);
}
function showBadges(me) {
  const badge = modBadges.live;
  if (!badge) return;
  badge.hidden = !me.online;
  badge.textContent = me.online ? String(me.online) : "";
  badge.parentElement.setAttribute("aria-label", badge.parentElement.dataset.name + (me.online ? ", " + me.online + " online" : ""));
}
document.getElementById("signout").addEventListener("click", async () => {
  await api("POST", "logout", {}).catch(() => {});
  signedOut();
});

let token = 0;
const decodeSegment = (s) => { try { return decodeURIComponent(s); } catch (err) { return s; } };
async function route() {
  leavePage(); // the old page's timers (live refresh, chat tail)
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, query] = raw.split("?");
  const [first, ...rest] = path.split("/");
  const tab = TABS.some(([id]) => id === first) ? first : "live";
  const params = new URLSearchParams(query || "");
  for (const a of tabsNav.querySelectorAll("a")) {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  const mine = ++token;
  const alive = () => token === mine;
  view.replaceChildren(h("div.loading", {}, "Loading…"));
  let blocks;
  try {
    const me = await api("GET", "session");
    modSession = me;
    document.getElementById("who").textContent = "Signed in as " + me.name;
    showBadges(me);
    blocks = await PAGES[tab](params, rest.map(decodeSegment), alive);
  } catch (err) {
    if (err.status === 401) { signedOut(); return; }
    blocks = [isLogOff(err) ? loggingOff() : errorState(err)];
  }
  if (mine !== token) return;
  view.replaceChildren(...blocks.filter(Boolean));
  document.title = (TABS.find(([id]) => id === tab) || TABS[0])[1] + " · Moderators";
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
